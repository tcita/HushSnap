<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer bounding box representing the mosaic region -->
  <rect x="3" y="3" width="18" height="18" rx="2"/>

  <!-- Row 1: filled / empty / filled -->
  <rect x="5" y="5" width="4.5" height="4.5" fill="currentColor" stroke="none"/>
  <rect x="14.5" y="5" width="4.5" height="4.5" fill="currentColor" stroke="none"/>

  <!-- Row 2: empty / filled / empty -->
  <rect x="9.75" y="9.75" width="4.5" height="4.5" fill="currentColor" stroke="none"/>

  <!-- Row 3: filled / empty / filled -->
  <rect x="5" y="14.5" width="4.5" height="4.5" fill="currentColor" stroke="none"/>
  <rect x="14.5" y="14.5" width="4.5" height="4.5" fill="currentColor" stroke="none"/>
</svg>
